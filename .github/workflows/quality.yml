name: Quality baseline

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript baseline
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Report TypeScript debt
        if: steps.typecheck.outcome == 'failure'
        run: |
          echo "::warning::TypeScript errors remain in the existing codebase. The build passed because next.config.mjs still ignores build-time type errors."
